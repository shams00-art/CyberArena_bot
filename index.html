<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex 3D Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #bd00ff;
            --green: #00ff88;
            --red: #ff2a5f;
            --card-bg: rgba(14, 18, 30, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #06080e;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud-legend {
            position: absolute;
            top: 55px;
            left: 14px;
            z-index: 10;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .legend-tag {
            font-size: 11px;
            font-weight: 700;
            background: rgba(10, 14, 23, 0.8);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot-green { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot-red { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }

        .btn-center {
            position: absolute;
            bottom: 25px;
            right: 16px;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--cyan);
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Bottom Sheet (Modal Oyna) */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .sheet-overlay.active { display: block; opacity: 1; }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: -100%;
            background: #0d121f;
            border-top: 2px solid var(--cyan);
            border-radius: 22px 22px 0 0;
            padding: 18px 20px 30px;
            z-index: 101;
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -15px 40px rgba(0,0,0,0.9);
        }
        .bottom-sheet.active { bottom: 0; }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 15px;
        }

        .sheet-title-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sheet-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
        }

        .sheet-zone-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .badge-standart { background: rgba(0, 243, 255, 0.15); color: var(--cyan); }
        .badge-vip { background: rgba(189, 0, 255, 0.15); color: var(--purple); }

        .sheet-specs {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            color: #9ab0c4;
            line-height: 1.6;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sheet-calc {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }

        .calc-deposit-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--cyan);
            font-weight: 800;
        }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(90deg, var(--cyan), #0077ff);
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.4);
        }
        .btn-confirm:active { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="hud-header">
        <div class="hud-brand">APEX 3D ARENA</div>
    </div>

    <div class="hud-legend">
        <div class="legend-tag"><span class="dot-green"></span> Bo'sh (Bron)</div>
        <div class="legend-tag"><span class="dot-red"></span> Band</div>
    </div>

    <button class="btn-center" onclick="resetCamera()">🎯 Markazga</button>
    <canvas id="webgl-canvas"></canvas>

    <div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title-box">
            <div class="sheet-title" id="sheetPcTitle">PC-01</div>
            <div class="sheet-zone-badge badge-standart" id="sheetPcZone">STANDART</div>
        </div>
        <div class="sheet-specs" id="sheetPcSpecs">Yuklanmoqda...</div>
        <div class="sheet-calc">
            <div>
                <div style="font-size: 12px; color: #8c9ba5;">75% Majburiy Zalog:</div>
                <div style="font-size: 10px; color: #556270;">Yolg'on bron bo'lmasligi uchun</div>
            </div>
            <div class="calc-deposit-val" id="sheetDepositVal">0 UZS</div>
        </div>
        <button class="btn-confirm" id="btnBook" onclick="confirmAndSend()">JOYNI BRON QILISH</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const pcList = [
            { id: "01", zone: "standart", x: -4, z: -3.5, price: 7000, status: "free", cpu: "i5-12400F", gpu: "RTX 3060 12GB", hz: "165Hz" },
            { id: "02", zone: "standart", x: 0,  z: -3.5, price: 7000, status: "busy", cpu: "i5-12400F", gpu: "RTX 3060 12GB", hz: "165Hz" },
            { id: "03", zone: "standart", x: 4,  z: -3.5, price: 7000, status: "free", cpu: "i5-12400F", gpu: "RTX 3060 12GB", hz: "165Hz" },
            { id: "04", zone: "standart", x: 8,  z: -3.5, price: 7000, status: "free", cpu: "i5-12400F", gpu: "RTX 3060 12GB", hz: "165Hz" },
            { id: "05", zone: "vip",      x: -4, z: 3.5,  price: 12000, status: "free", cpu: "i7-13700KF", gpu: "RTX 4070 12GB", hz: "280Hz Asus" },
            { id: "06", zone: "vip",      x: 0,  z: 3.5,  price: 12000, status: "busy", cpu: "i7-13700KF", gpu: "RTX 4070 12GB", hz: "280Hz Asus" },
            { id: "07", zone: "vip",      x: 4,  z: 3.5,  price: 12000, status: "free", cpu: "i7-13700KF", gpu: "RTX 4070 12GB", hz: "280Hz Asus" },
            { id: "08", zone: "vip",      x: 8,  z: 3.5,  price: 12000, status: "free", cpu: "i7-13700KF", gpu: "RTX 4070 12GB", hz: "280Hz Asus" }
        ];

        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06080e);
        scene.fog = new THREE.FogExp2(0x06080e, 0.04);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2, 9, 14);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(2, 0, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 12, 8);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(30, 30, 0x00f3ff, 0x1f263b);
        grid.position.y = 0.01;
        scene.add(grid);

        const clickableObjects = [];

        function createDesk(data) {
            const group = new THREE.Group();
            group.position.set(data.x, 0, data.z);

            const isFree = data.status === "free";
            const glowColor = isFree ? 0x00ff88 : 0xff2a5f;

            // Stol
            const desk = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 0.1, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x181c26 })
            );
            desk.position.y = 1.2;
            group.add(desk);

            // Ekran
            const screen = new THREE.Mesh(
                new THREE.PlaneGeometry(1.3, 0.68),
                new THREE.MeshStandardMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.9 })
            );
            screen.position.set(0, 1.75, -0.17);
            group.add(screen);

            // HitBox (Bosiladigan ko'rinmas oyna)
            const hitBox = new THREE.Mesh(
                new THREE.BoxGeometry(2.6, 2.2, 2.0),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitBox.position.set(0, 1.2, 0);
            hitBox.userData = data;
            group.add(hitBox);

            clickableObjects.push(hitBox);
            scene.add(group);
        }

        pcList.forEach(createDesk);

        // Barmoq harakatini aniqlash (Oddiy bosish bilan aylantirishni ajratish)
        let startX = 0, startY = 0;
        window.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            const diffX = Math.abs(e.clientX - startX);
            const diffY = Math.abs(e.clientY - startY);
            if (diffX > 8 || diffY > 8) return; // Agar foydalanuvchi ekranni aylantirgan bo'lsa, bosish hisoblanmaydi

            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                openSheet(intersects[0].object.userData);
            }
        });

        let currentSelectedPC = null;

        function openSheet(pc) {
            currentSelectedPC = pc;
            if (pc.status !== "free") {
                if (tg?.showAlert) tg.showAlert(`PC-${pc.id} band! Bo'sh (yashil) joyni tanlang.`);
                else alert(`PC-${pc.id} band!`);
                return;
            }

            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const deposit = Math.round(pc.price * 0.75);
            document.getElementById('sheetPcTitle').innerText = `PC-${pc.id}`;
            const badge = document.getElementById('sheetPcZone');
            badge.innerText = pc.zone.toUpperCase();
            badge.className = `sheet-zone-badge badge-${pc.zone}`;

            document.getElementById('sheetPcSpecs').innerHTML = `
                ⚡️ <b>CPU:</b> ${pc.cpu}<br>
                🎮 <b>GPU:</b> ${pc.gpu}<br>
                🖥 <b>Monitor:</b> ${pc.hz}<br>
                💰 <b>Tarif:</b> ${pc.price.toLocaleString()} UZS / soat
            `;
            document.getElementById('sheetDepositVal').innerText = `${deposit.toLocaleString()} UZS`;

            document.getElementById('overlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        function resetCamera() {
            controls.target.set(2, 0, 0);
            camera.position.set(2, 9, 14);
        }

        function confirmAndSend() {
            if (!currentSelectedPC) return;

            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const payload = JSON.stringify({
                pc_id: currentSelectedPC.id,
                price: currentSelectedPC.price
            });

            // Telegram botga ma'lumot uzatish
            if (tg && tg.sendData) {
                tg.sendData(payload);
            } else {
                alert(`PC-${currentSelectedPC.id} uchun bron yuborildi!`);
                closeSheet();
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
