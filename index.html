<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Cyber Arena | 3D Zal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #080a10;
            --card-bg: rgba(18, 24, 38, 0.7);
            --cyan-glow: #00f3ff;
            --purple-glow: #bd00ff;
            --green-active: #00ff88;
            --red-busy: #ff2a5f;
            --text-main: #f0f4fc;
            --text-muted: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(189, 0, 255, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* Yuqori Header */
        header {
            padding: 20px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(8, 10, 16, 0.85);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--cyan-glow), var(--purple-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--green-active);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--green-active);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-active);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Statistika va Filtrlash */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px 16px;
        }

        .stat-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
        }

        .stat-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filters {
            display: flex;
            gap: 8px;
            padding: 6px 16px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-chip.active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(189, 0, 255, 0.2));
            color: #fff;
            border-color: var(--cyan-glow);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        /* 3D Zal Arena Maydoni */
        .arena-container {
            perspective: 1000px;
            padding: 10px 16px;
        }

        .pc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            transform-style: preserve-3d;
        }

        .pc-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
        }

        .pc-card:active {
            transform: scale(0.96) translateZ(-5px);
        }

        .pc-card.free {
            border-bottom: 3px solid var(--green-active);
        }

        .pc-card.free:hover {
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.18);
            border-color: rgba(0, 255, 136, 0.4);
        }

        .pc-card.busy {
            border-bottom: 3px solid var(--red-busy);
            opacity: 0.65;
            filter: grayscale(0.2);
        }

        .zone-pill {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .zone-standart { background: rgba(0, 243, 255, 0.15); color: var(--cyan-glow); }
        .zone-vip { background: rgba(189, 0, 255, 0.15); color: var(--purple-glow); }
        .zone-bootcamp { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }

        .pc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .pc-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .free .status-dot { background: var(--green-active); box-shadow: 0 0 6px var(--green-active); }
        .busy .status-dot { background: var(--red-busy); box-shadow: 0 0 6px var
